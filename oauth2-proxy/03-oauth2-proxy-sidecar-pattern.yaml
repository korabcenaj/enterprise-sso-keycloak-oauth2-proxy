apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-app-with-sso-sidecar
  namespace: prod
  labels:
    app: legacy-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-portal
  template:
    metadata:
      labels:
        app: legacy-portal
    spec:
      containers:
        # The legacy application container (no native OIDC authentication)
        # Binds to localhost:8080 only.
        - name: legacy-app
          image: internal-registry.enterprise.internal/apps/legacy-portal:v2.4
          env:
            - name: LISTEN_PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # OAuth2-Proxy sidecar intercepting incoming traffic on port 4180
        # Validates OIDC session cookie with Keycloak before forwarding to localhost:8080
        - name: oauth2-proxy-sidecar
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8080/
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://sso.enterprise.internal/realms/enterprise-platform
            - --client-id=oauth2-proxy
            - --cookie-name=_legacy_sso
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --email-domain=*
            - --pass-user-headers=true
            - --set-xauthrequest=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - name: http-proxy
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
