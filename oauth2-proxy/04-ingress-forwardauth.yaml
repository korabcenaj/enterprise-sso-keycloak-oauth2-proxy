apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso-forwardauth
  namespace: identity
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
      - Authorization
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal-tools-ingress
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: identity-sso-forwardauth@kubernetescrd
    # For NGINX Ingress alternative:
    # nginx.ingress.kubernetes.io/auth-url: "https://auth.enterprise.internal/oauth2/auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://auth.enterprise.internal/oauth2/start?rd=$escaped_request_uri"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - internal-tools.enterprise.internal
      secretName: internal-tools-tls
  rules:
    - host: internal-tools.enterprise.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legacy-app-service
                port:
                  number: 8080
